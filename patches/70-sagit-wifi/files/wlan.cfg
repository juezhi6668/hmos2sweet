{
    "jobs" : [{
            "name" : "boot",
            "cmds" : [
                "start wlanup"
            ]
        }
    ],
    "services" : [{
            "name" : "wlanup",
            "path" : ["/system/bin/sh", "/vendor/bin/wlan-up.sh"],
            "start-mode" : "boot",
            "once" : 1,
            "uid" : "root",
            "gid" : ["root"],
            "sandbox" : 0,
            "secon" : "u:r:ohos_isula:s0"
        }
    ]
}
